# Fly.io config for the Multica Go backend.
#
# Usage:
#   fly deploy -c fly.backend.toml
#
# This app is private — no [http_service] block. It is only reachable
# from the multica-web app over Fly's 6PN private network at
# http://multica-backend.flycast:8080.

app = "multica-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

# No [[mounts]] — uploads go to Tigris (see S3_* secrets).
# No [http_service] — backend has no public hostname.

# Internal-only service definition so multica-web can reach the backend
# via http://multica-backend.flycast:8080. flycast hostname auto-resolves
# inside the org's private network.
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  # Required for flycast hostname allocation. handlers = [] means no
  # public ingress is wired even if a public IP gets allocated; the
  # port mapping is just what makes Fly assign multica-backend.flycast
  # an internal 6PN address. Do NOT add handlers like "http"/"tls" or
  # this becomes public.
  [[services.ports]]
    port = 8080
    handlers = []

  # Readiness check: /readyz returns 200 only after DB ping succeeds AND
  # the latest migration has been applied. Gate behind this so Fly does
  # not route flycast traffic to a half-started machine.
  #
  # grace_period covers boot-time migration, which the entrypoint runs before
  # the server starts. A deploy spanning many upstream releases applies a large
  # batch of migrations serially, several of them CREATE INDEX CONCURRENTLY, and
  # a 60s grace marked the machine unhealthy while migrate was still making
  # progress. A failed migration still crash-loops the machine, so a long grace
  # delays the verdict without hiding a real failure.
  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "600s"
    method = "get"
    path = "/readyz"
    protocol = "http"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  swap_size_mb = 512
