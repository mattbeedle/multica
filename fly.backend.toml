# Fly.io config for the Multica Go backend.
#
# Usage:
#   fly deploy -c fly.backend.toml
#
# This app is private — no [http_service] block. It is only reachable
# from the multica-web app over Fly's 6PN private network at
# http://multica-backend.flycast:8080.

app = "multica-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

# No [[mounts]] — uploads go to Tigris (see S3_* secrets).
# No [http_service] — backend has no public hostname.

# Internal-only service definition so multica-web can reach the backend
# via http://multica-backend.flycast:8080. flycast hostname auto-resolves
# inside the org's private network.
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8080
    handlers = []

  # Readiness check: /readyz returns 200 only after DB ping succeeds AND
  # the latest migration has been applied. Gate behind this so Fly does
  # not route flycast traffic to a half-started machine.
  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "get"
    path = "/readyz"
    protocol = "http"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
